# Método ESN — Nginx + PHP-FPM
server {
    listen 80;
    server_name metodoesn.com www.metodoesn.com;
    return 301 https://metodoesn.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.metodoesn.com;
    ssl_certificate     /etc/letsencrypt/live/metodoesn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metodoesn.com/privkey.pem;
    return 301 https://metodoesn.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name metodoesn.com;
    ssl_certificate     /etc/letsencrypt/live/metodoesn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metodoesn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/metodoesn/public;       # NUNCA la raíz del proyecto
    index index.php;
    server_tokens off;
    client_max_body_size 64k;             # el formulario solo envía texto

    # HSTS (la CSP con nonce la envía PHP; estas cabeceras cubren también estáticos)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Denegar dotfiles (salvo .well-known), datos y artefactos
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(sqlite3?|db|key|env|log|sql|bak|sh|md|lock|json|ini)$ { deny all; return 404; }
    location ^~ /data/ { deny all; return 404; }

    location = /index.php { if ($request_uri ~* "^/index\.php") { return 301 /$is_args$args; } include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
    location = /sitemap.xml { rewrite ^ /sitemap.php last; }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(css|js|png|jpe?g|webp|avif|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rate limiting de red como primera barrera (la lógica 3/15min vive en PHP/SQLite)
    # En http{}: limit_req_zone $binary_remote_addr zone=contacto:10m rate=10r/m;
    location = /contacto.php {
        limit_req zone=contacto burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Solo se ejecutan los .php de public/ (nada de PATH_INFO)
    location ~ ^/[A-Za-z0-9._-]+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param PHP_VALUE "expose_php=0\nsession.cookie_httponly=1\nsession.cookie_samesite=Lax\nsession.use_strict_mode=1";
    }
    location ~ \.php$ { return 404; }
}
